<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Crash Game</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
  margin:0;
  background:#0f172a;
  color:white;
  font-family:Arial;
}

/* TOP */
.topbar{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  padding:12px;
  gap:10px;
  background:#111827;
}

.balance{
  background:#1f2937;
  padding:6px 10px;
  border-radius:10px;
}

.profile{
  width:38px;
  height:38px;
  border-radius:50%;
  overflow:hidden;
}

.profile img{
  width:100%;
  height:100%;
}

/* TIMER */
.timer{
  position:absolute;
  top:40%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:40px;
  color:#22c55e;
  display:none;
}

/* GAME AREA */
.game{
  height:350px;
  position:relative;
  text-align:center;
}

/* ROCKET */
#rocket{
  font-size:45px;
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  bottom:0;
}

/* MULT */
#mult{
  font-size:26px;
  margin-top:10px;
  color:#22c55e;
}

/* BET */
.bet{
  text-align:center;
  margin-top:10px;
}

input{
  padding:10px;
  font-size:18px;
  width:120px;
  text-align:center;
  border-radius:10px;
  border:none;
}

/* HISTORY UNDER ROCKET */
.history{
  position:absolute;
  bottom:0;
  width:100%;
  display:flex;
  gap:8px;
  padding:8px;
  overflow-x:auto;
}

.item{
  background:#1f2937;
  padding:6px 10px;
  border-radius:10px;
  white-space:nowrap;
}
</style>
</head>

<body>

<!-- TOP -->
<div class="topbar">
  <div class="balance">⭐ <span id="bal">1000</span></div>
  <div class="profile">
    <img src="https://i.pravatar.cc/100">
  </div>
</div>

<!-- TIMER -->
<div class="timer" id="timer">5</div>

<!-- GAME -->
<div class="game">

  <div id="mult">1.00x</div>
  <div id="rocket">🚀</div>

  <!-- HISTORY UNDER ROCKET -->
  <div class="history" id="history"></div>

</div>

<!-- BET -->
<div class="bet">
  <div>Ставка (min 10)</div>

  <input id="bet" type="number" value="10" min="10">

  <br>

  <button onclick="setBet(-10)">-10</button>
  <button onclick="setBet(10)">+10</button>
  <button onclick="maxBet()">MAX</button>

  <br>

  <button onclick="placeBet()">Поставить</button>
</div>

<script>
let balance = 1000;
let mult = 1;
let crashAt = 0;
let flying = false;
let interval;
let history = [];

function update(){
  document.getElementById("bal").innerText = balance;
}

function setBet(v){
  let b = document.getElementById("bet");
  b.value = Math.max(10, Number(b.value) + v);
}

function maxBet(){
  document.getElementById("bet").value = balance;
}

function showTimer(){
  let t = 5;
  let timer = document.getElementById("timer");
  timer.style.display = "block";

  let int = setInterval(()=>{
    timer.innerText = t;
    t--;

    if(t < 0){
      clearInterval(int);
      timer.style.display = "none";
      startRound();
    }
  },1000);
}

function startRound(){
  flying = true;
  mult = 1;
  crashAt = (Math.random()*3 + 1.5);

  interval = setInterval(()=>{
    mult += 0.05;

    document.getElementById("mult").innerText = mult.toFixed(2)+"x";

    document.getElementById("rocket").style.bottom = (mult*20)+"px";

    if(mult >= crashAt){
      endRound();
    }
  },100);
}

function endRound(){
  clearInterval(interval);
  flying = false;

  history.unshift(crashAt.toFixed(2)+"x");
  if(history.length > 10) history.pop();

  renderHistory();

  document.getElementById("mult").innerText = "💥 "+crashAt.toFixed(2);

  setTimeout(()=>{
    showTimer();
  },1000);
}

function renderHistory(){
  let h = document.getElementById("history");
  h.innerHTML = "";

  history.forEach(x=>{
    let d = document.createElement("div");
    d.className = "item";
    d.innerText = x;
    h.appendChild(d);
  });
}

function placeBet(){
  let bet = Number(document.getElementById("bet").value);

  if(bet < 10) return alert("min 10");
  if(bet > balance) return alert("no money");

  balance -= bet;
  update();
}

showTimer();
update();
</script>

</body>
</html>
