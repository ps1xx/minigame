<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Crash Game</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
  margin:0;
  background:#0f172a;
  color:white;
  font-family:Arial;
}

/* TOP */
.topbar{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  padding:12px;
  gap:10px;
  background:#111827;
}

.balance{
  background:#1f2937;
  padding:6px 10px;
  border-radius:10px;
}

.profile{
  width:38px;
  height:38px;
  border-radius:50%;
  overflow:hidden;
}

.profile img{width:100%;height:100%;}

/* MENU */
.menu{
  display:flex;
  gap:10px;
  padding:10px;
  justify-content:center;
}

.menu button{
  padding:8px 12px;
  border:none;
  border-radius:10px;
  background:#1f2937;
  color:white;
  cursor:pointer;
}

/* TIMER */
.timer{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:80px;
  color:#22c55e;
  display:none;
}

/* GAME */
.game{
  height:380px;
  position:relative;
  text-align:center;
  overflow:hidden;
}

#mult{
  font-size:30px;
  margin-top:10px;
  color:#22c55e;
}

#rocket{
  font-size:50px;
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  bottom:0;
}

/* BET OVERLAY */
.betOverlay{
  position:absolute;
  bottom:0;
  width:100%;
  background:rgba(17,24,39,0.6);
  padding:6px;
  display:flex;
  gap:8px;
  overflow-x:auto;
}

.betItem{
  background:#1f2937;
  padding:6px 10px;
  border-radius:10px;
  white-space:nowrap;
  font-size:12px;
}

/* BET PANEL */
.bet{
  text-align:center;
  margin-top:10px;
}

input{
  padding:10px;
  font-size:18px;
  width:120px;
  text-align:center;
  border-radius:10px;
  border:none;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="balance">⭐ <span id="bal">1000</span></div>
  <div class="profile">
    <img src="https://i.pravatar.cc/100">
  </div>
</div>

<!-- MENU -->
<div class="menu">
  <button onclick="mode='rocket'">🚀 Rocket</button>
  <button onclick="mode='classic'">🎮 Classic</button>
</div>

<!-- TIMER -->
<div class="timer" id="timer">5</div>

<div class="game">
  <div id="mult">1.00x</div>
  <div id="rocket">🚀</div>

  <!-- BET OVERLAY -->
  <div class="betOverlay" id="betOverlay"></div>
</div>

<div class="bet">
  <div>Ставка (min 10)</div>

  <input id="bet" type="number" value="10" min="10">

  <br>

  <button onclick="setBet(-10)">-10</button>
  <button onclick="setBet(10)">+10</button>
  <button onclick="maxBet()">MAX</button>

  <br>

  <button onclick="placeBet()">Поставить</button>
</div>

<script>
let balance = 1000;
let mult = 1;
let crashAt = 0;
let flying = false;
let interval;
let speed = 0.01;
let bets = [];
let mode = "rocket";

function update(){
  document.getElementById("bal").innerText = balance;
}

function setBet(v){
  let b = document.getElementById("bet");
  b.value = Math.max(10, Number(b.value) + v);
}

function maxBet(){
  document.getElementById("bet").value = balance;
}

/* BETS */
function placeBet(){
  let bet = Number(document.getElementById("bet").value);

  if(bet < 10) return alert("min 10");
  if(bet > balance) return alert("no money");

  balance -= bet;

  bets.push({
    amount: bet,
    startMult: mult,
    cashout: null,
    profit: 0
  });

  update();
  renderBets();
}

/* TIMER */
function showTimer(){
  let t = 5;
  let timer = document.getElementById("timer");
  timer.style.display = "block";

  let int = setInterval(()=>{
    timer.innerText = t;
    t--;

    if(t < 0){
      clearInterval(int);
      timer.style.display = "none";
      startRound();
    }
  },1000);
}

/* ROUND */
function startRound(){
  flying = true;
  mult = 1;
  speed = 0.01;
  crashAt = (Math.random()*3 + 1.5);

  interval = setInterval(()=>{
    speed += 0.01;        // разгон
    mult += speed;        // плавный рост

    document.getElementById("mult").innerText = mult.toFixed(2)+"x";
    document.getElementById("rocket").style.bottom = (mult*18)+"px";

    updateBets();

    if(mult >= crashAt){
      endRound();
    }
  },100);
}

/* BET UPDATE (растёт от икса) */
function updateBets(){
  bets.forEach(b=>{
    b.profit = (b.amount * mult / b.startMult) - b.amount;
  });
  renderBets();
}

function renderBets(){
  let el = document.getElementById("betOverlay");
  el.innerHTML = "";

  bets.slice(-6).forEach(b=>{
    let d = document.createElement("div");
    d.className = "betItem";
    d.innerText = `💰 ${b.amount}$ | +${b.profit.toFixed(1)}$ | x${mult.toFixed(2)}`;
    el.appendChild(d);
  });
}

/* END */
function endRound(){
  clearInterval(interval);
  flying = false;

  document.getElementById("mult").innerText = "💥 "+crashAt.toFixed(2);

  setTimeout(()=>{
    showTimer();
  },1500);
}

update();
showTimer();
</script>

</body>
</html>
