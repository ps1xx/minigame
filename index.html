<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Rocket Game</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
  margin:0;
  background:#0f172a;
  color:white;
  font-family:Arial;
}

/* TOP */
.topbar{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  padding:12px;
  gap:10px;
  background:#111827;
}

.balance{
  background:#1f2937;
  padding:6px 10px;
  border-radius:10px;
}

.profile{
  width:38px;
  height:38px;
  border-radius:50%;
  overflow:hidden;
  background:#22c55e;
}
.profile img{
  width:100%;
  height:100%;
}

/* GAME AREA */
.game{
  text-align:center;
  margin-top:20px;
  position:relative;
  height:300px;
}

#rocket{
  font-size:40px;
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  bottom:0;
}

#mult{
  font-size:30px;
  color:#22c55e;
  margin-top:10px;
}

/* BET */
.betbox{
  margin-top:20px;
  text-align:center;
}

input{
  padding:10px;
  font-size:18px;
  width:120px;
  text-align:center;
  border-radius:10px;
  border:none;
}

/* BUTTONS */
button{
  margin:5px;
  padding:10px 15px;
  border:none;
  border-radius:10px;
  background:#334155;
  color:white;
}

/* HISTORY */
.history{
  position:fixed;
  bottom:0;
  width:100%;
  background:#111827;
  padding:10px;
  display:flex;
  gap:10px;
  overflow-x:auto;
}

.item{
  background:#1f2937;
  padding:6px 10px;
  border-radius:10px;
  white-space:nowrap;
}
</style>
</head>

<body>

<!-- TOP -->
<div class="topbar">
  <div class="balance">⭐ <span id="bal">1000</span></div>
  <div class="profile">
    <img id="ava" src="https://i.pravatar.cc/100">
  </div>
</div>

<!-- GAME -->
<div class="game">
  <div id="mult">1.00x</div>
  <div id="rocket">🚀</div>
</div>

<!-- BET -->
<div class="betbox">
  <div>Ставка (min 10)</div>

  <input id="bet" type="number" value="10" min="10">

  <br>

  <button onclick="setBet(-10)">-10</button>
  <button onclick="setBet(10)">+10</button>
  <button onclick="maxBet()">MAX</button>

  <br>

  <button onclick="placeBet()">Поставить</button>

  <p id="timer">Следующий раунд: 5</p>
</div>

<!-- HISTORY -->
<div class="history" id="history"></div>

<script>
let tg = window.Telegram.WebApp;
tg.expand();

let balance = 1000;
let mult = 1;
let rocket = document.getElementById("rocket");
let history = [];

let roundTime = 5;
let flying = false;
let crashAt = 0;
let interval;

// avatar
if(tg.initDataUnsafe?.user?.photo_url){
  document.getElementById("ava").src = tg.initDataUnsafe.user.photo_url;
}

function update(){
  document.getElementById("bal").innerText = balance;
}

function setBet(v){
  let b = document.getElementById("bet");
  b.value = Math.max(10, Number(b.value) + v);
}

function maxBet(){
  document.getElementById("bet").value = balance;
}

function startTimer(){
  let t = 5;

  let timer = setInterval(()=>{
    document.getElementById("timer").innerText = "Следующий раунд: " + t;
    t--;

    if(t < 0){
      clearInterval(timer);
      startRound();
      startTimer();
    }
  },1000);
}

function startRound(){
  if(flying) return;

  flying = true;
  mult = 1;
  crashAt = (Math.random()*3 + 1.5);

  rocket.style.bottom = "0px";

  interval = setInterval(()=>{
    mult += 0.05;

    document.getElementById("mult").innerText = mult.toFixed(2) + "x";

    rocket.style.bottom = (mult*20) + "px";

    if(mult >= crashAt){
      endRound();
    }
  },100);
}

function endRound(){
  clearInterval(interval);
  flying = false;

  history.unshift(crashAt.toFixed(2)+"x");

  if(history.length > 10) history.pop();

  renderHistory();

  document.getElementById("mult").innerText = "💥 " + crashAt.toFixed(2);
}

function renderHistory(){
  let h = document.getElementById("history");
  h.innerHTML = "";

  history.forEach(x=>{
    let div = document.createElement("div");
    div.className = "item";
    div.innerText = x;
    h.appendChild(div);
  });
}

function placeBet(){
  let bet = Number(document.getElementById("bet").value);

  if(bet < 10){
    alert("min 10");
    return;
  }

  if(bet > balance){
    alert("no money");
    return;
  }

  balance -= bet;
  update();
}

startTimer();
update();
</script>

</body>
</html>
