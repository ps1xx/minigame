<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mini Game</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
  margin: 0;
  background: #0f172a;
  color: white;
  font-family: Arial;
}

/* TOP BAR */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px;
}

/* BALANCE */
.balance {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #111827;
  padding: 8px 12px;
  border-radius: 12px;
  font-size: 16px;
}

/* PROFILE */
.profile {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #22c55e;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  cursor: pointer;
  overflow: hidden;
}

.profile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* MAIN */
.center {
  text-align: center;
  margin-top: 80px;
}

button {
  padding: 12px 20px;
  margin: 8px;
  border: none;
  border-radius: 10px;
  background: #3b82f6;
  color: white;
  font-size: 16px;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">

  <!-- BALANCE -->
  <div class="balance">
    ⭐ <span id="balance">1000</span>
  </div>

  <!-- PROFILE -->
  <div class="profile" onclick="openProfile()">
    <img id="avatar" src="https://i.pravatar.cc/100" />
  </div>

</div>

<!-- MAIN -->
<div class="center">
  <h1>🎮 Mini Game</h1>

  <button onclick="addCoins()">+10 ⭐</button>
  <button onclick="removeCoins()">-10 ⭐</button>
</div>

<script>
let tg = window.Telegram.WebApp;
tg.expand();

let balance = 1000;

// профиль Telegram (если доступен)
if (tg.initDataUnsafe?.user?.photo_url) {
  document.getElementById("avatar").src = tg.initDataUnsafe.user.photo_url;
}

function update() {
  document.getElementById("balance").innerText = balance;
}

function addCoins() {
  balance += 10;
  update();
}

function removeCoins() {
  balance -= 10;
  update();
}

function openProfile() {
  alert("Профиль игрока 🎮");
}
</script>

</body>
</html>
