<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mini Games</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
  margin:0;
  background:#0f172a;
  color:white;
  font-family:Arial;
}

/* TOP BAR */
.top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px;
  background:#111827;
}

.title {
  font-size:18px;
  font-weight:bold;
}

/* BALANCE */
.balance {
  background:#1f2937;
  padding:6px 10px;
  border-radius:10px;
}

/* PROFILE */
.profile {
  width:38px;
  height:38px;
  border-radius:50%;
  overflow:hidden;
  background:#22c55e;
}

.profile img {
  width:100%;
  height:100%;
}

/* MENU BUTTON */
.menu-btn {
  margin:30px auto;
  width:85%;
  padding:18px;
  background:#1d4ed8;
  border-radius:15px;
  text-align:center;
  font-size:18px;
  cursor:pointer;
}

/* MODAL */
.modal {
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:#0f172a;
}

/* ROCKET */
.rocket {
  font-size:50px;
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
}

/* BET AREA */
.bet {
  position:absolute;
  bottom:120px;
  width:100%;
  text-align:center;
}

.bet button {
  margin:5px;
  padding:10px 15px;
  border:none;
  border-radius:10px;
  background:#334155;
  color:white;
}

.place {
  background:#22c55e;
  margin-top:10px;
  padding:12px 20px;
  border:none;
  border-radius:12px;
}
</style>
</head>

<body>

<!-- TOP -->
<div class="top">
  <div class="title">🎮 MINI GAMES</div>

  <div style="display:flex; gap:10px; align-items:center;">
    <div class="balance">⭐ <span id="bal">1000</span></div>
    <div class="profile">
      <img id="ava" src="https://i.pravatar.cc/100">
    </div>
  </div>
</div>

<!-- MAIN BUTTON -->
<div class="menu-btn" onclick="openGame()">
  🚀 OPEN GAME
</div>

<!-- MODAL GAME -->
<div class="modal" id="game">

  <div class="top">
    <div class="title">🎯 ROCKET GAME</div>
    <div class="balance">⭐ <span id="bal2">1000</span></div>
  </div>

  <!-- ROCKET -->
  <div class="rocket" id="rocket">🚀</div>

  <!-- BET -->
  <div class="bet">

    <div>Ставка (min 10)</div>

    <button onclick="bet(-10)">-10</button>
    <span id="bet">10</span>
    <button onclick="bet(10)">+10</button>
    <button onclick="bet('max')">MAX</button>

    <br>

    <button class="place" onclick="start()">Поставить</button>

    <p id="status"></p>
  </div>

</div>

<script>
let tg = window.Telegram.WebApp;
tg.expand();

let balance = 1000;
let betAmount = 10;
let flying = false;

function update(){
  document.getElementById("bal").innerText = balance;
  document.getElementById("bal2").innerText = balance;
}

function bet(v){
  if(v === 'max'){
    betAmount = balance;
  } else {
    betAmount += v;
  }

  if(betAmount < 10) betAmount = 10;
  if(betAmount > balance) betAmount = balance;

  document.getElementById("bet").innerText = betAmount;
}

function openGame(){
  document.getElementById("game").style.display="block";
}

function start(){
  if(flying) return;

  flying = true;
  document.getElementById("status").innerText = "5 сек до старта...";

  setTimeout(()=>{
    fly();
  },5000);
}

function fly(){
  document.getElementById("status").innerText = "🚀 Полёт начался!";

  let rocket = document.getElementById("rocket");
  let pos = 0;

  let int = setInterval(()=>{
    pos += 5;
    rocket.style.bottom = pos + "px";

    if(pos > 400){
      clearInterval(int);
      rocket.style.bottom = "20px";
      flying = false;

      document.getElementById("status").innerText = "💥 Упал!";
    }
  },50);
}

update();
</script>

</body>
</html>
