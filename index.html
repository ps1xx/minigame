<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Crash Game</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
  margin: 0;
  background: #0f172a;
  color: white;
  font-family: Arial;
}

/* TOP BAR */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px;
  background: #111827;
}

/* LEFT TITLE */
.title {
  font-size: 18px;
  font-weight: bold;
}

/* RIGHT SIDE */
.right {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* BALANCE */
.balance {
  display: flex;
  align-items: center;
  gap: 6px;
  background: #1f2937;
  padding: 6px 10px;
  border-radius: 10px;
}

/* PROFILE */
.profile {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  overflow: hidden;
  background: #22c55e;
}

.profile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* CENTER */
.center {
  text-align: center;
  margin-top: 60px;
}

#m {
  font-size: 50px;
  color: #22c55e;
  margin-bottom: 20px;
}

/* BUTTON */
button {
  padding: 12px 22px;
  font-size: 16px;
  border: none;
  border-radius: 10px;
  background: #3b82f6;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #2563eb;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">

  <div class="title">🎮 CRASH GAME</div>

  <div class="right">

    <div class="balance">
      ⭐ <span id="balance">1000</span>
    </div>

    <div class="profile">
      <img id="avatar" src="https://i.pravatar.cc/100">
    </div>

  </div>

</div>

<!-- MAIN -->
<div class="center">

  <div id="m">1.00x</div>

  <button onclick="start()">PLAY CRASH</button>

  <p id="status"></p>

</div>

<script>
let tg = window.Telegram.WebApp;
tg.expand();

let balance = 1000;
let m = 1;
let run = false;
let crashAt;
let interval;

// avatar from Telegram
if (tg.initDataUnsafe?.user?.photo_url) {
  document.getElementById("avatar").src = tg.initDataUnsafe.user.photo_url;
}

function update() {
  document.getElementById("balance").innerText = balance;
}

function start() {
  if (run) return;

  run = true;
  m = 1;
  crashAt = (Math.random() * 3 + 1.2);

  document.getElementById("status").innerText = "Game started";

  interval = setInterval(() => {
    m += 0.05;
    document.getElementById("m").innerText = m.toFixed(2) + "x";

    if (m >= crashAt) {
      clearInterval(interval);
      run = false;
      document.getElementById("status").innerText =
        "💥 CRASH at " + crashAt.toFixed(2);
    }
  }, 100);
}
</script>

</body>
</html>
